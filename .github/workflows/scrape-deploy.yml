name: Scrape The5ers Dashboard

on:
  schedule:
    - cron: '0 1 * * *'   # 8h VN mỗi ngày
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: |
          cd scraper
          npm install --no-audit --no-fund 2>&1
      
      - name: Scrape The5ers
        env:
          THE5ERS_COOKIES: ${{ secrets.THE5ERS_COOKIES }}
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
        run: |
          mkdir -p scraper/data
          cd scraper
          node scraper.mjs
      
      - name: Copy data & build
        run: |
          mkdir -p dashboard/public/data
          cp scraper/data/profile.json dashboard/public/data/ 2>/dev/null || true
          cd dashboard && npm ci && npm run build
      
      - name: Commit & push data
        run: |
          git config user.name "the5ers-bot"
          git config user.email "bot@the5ers-dashboard"
          git add dashboard/public/data/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "auto: update data $(date +%Y-%m-%d) [skip ci]" && git push)
